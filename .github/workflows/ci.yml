name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://kinlilo:kinlilo@127.0.0.1:5432/kinlilo_test
      KINLILO_TEST_DATABASE_URL: postgresql://kinlilo:kinlilo@127.0.0.1:5432/kinlilo_test
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kinlilo_test
          POSTGRES_USER: kinlilo
          POSTGRES_PASSWORD: kinlilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinlilo -d kinlilo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check workspaces
        run: pnpm typecheck
      - name: Build web app
        run: pnpm build
      - name: Migrate test database
        run: |
          umask 077
          printf 'BETTER_AUTH_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
          pnpm db:migrate
      - name: Run integration tests
        run: pnpm test:integration
