services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kinlilo
      POSTGRES_USER: kinlilo
      POSTGRES_PASSWORD: kinlilo
    ports:
      - "127.0.0.1:54399:5432"
    volumes:
      - kinlilo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kinlilo", "-d", "kinlilo"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  kinlilo_db:
